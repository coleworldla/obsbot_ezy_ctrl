name: Release

# Push a tag like v0.7.0: the release is created from the matching CHANGELOG section, then the
# Windows installer + portable exe and the macOS (Apple Silicon + Intel) dmg/zip are attached,
# together with the latest*.yml files the in-app updater reads.
#
# Optional signing secrets (unsigned builds are produced when they are absent):
#   WIN_CSC_LINK / WIN_CSC_KEY_PASSWORD     base64 .pfx + password for Windows Authenticode
#   MAC_CSC_LINK / MAC_CSC_KEY_PASSWORD     base64 .p12 + password (Developer ID Application)
#   APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID   for notarization

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract release notes from CHANGELOG.md
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { on=1; next }
            on && index($0, "## [") == 1 { exit }
            on { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then echo "Release $GITHUB_REF_NAME" > release-notes.md; fi
          cat release-notes.md
      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: release-notes.md

  windows:
    needs: release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Configure code signing (only when secrets exist)
        shell: bash
        run: |
          if [ -n "${{ secrets.WIN_CSC_LINK }}" ]; then
            echo "CSC_LINK=${{ secrets.WIN_CSC_LINK }}" >> "$GITHUB_ENV"
            echo "CSC_KEY_PASSWORD=${{ secrets.WIN_CSC_KEY_PASSWORD }}" >> "$GITHUB_ENV"
            echo "signing: certificate configured"
          else
            echo "signing: no certificate, unsigned build"
          fi
      - run: npx electron-builder --win --publish never
      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml

  macos:
    needs: release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Fetch ffmpeg for both architectures
        run: node scripts/fetch-ffmpeg.mjs mac arm64 x64
      - name: Configure code signing (only when secrets exist)
        run: |
          if [ -n "${{ secrets.MAC_CSC_LINK }}" ]; then
            echo "CSC_LINK=${{ secrets.MAC_CSC_LINK }}" >> "$GITHUB_ENV"
            echo "CSC_KEY_PASSWORD=${{ secrets.MAC_CSC_KEY_PASSWORD }}" >> "$GITHUB_ENV"
            echo "signing: Developer ID configured"
          else
            # No Developer ID: ad-hoc sign (identity "-") so the app still launches on Apple Silicon.
            echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
            echo "MAC_EB_ARGS=-c.mac.identity=-" >> "$GITHUB_ENV"
            echo "signing: no Developer ID, ad-hoc signed build"
          fi
          if [ -n "${{ secrets.APPLE_ID }}" ]; then
            echo "APPLE_ID=${{ secrets.APPLE_ID }}" >> "$GITHUB_ENV"
            echo "APPLE_APP_SPECIFIC_PASSWORD=${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}" >> "$GITHUB_ENV"
            echo "APPLE_TEAM_ID=${{ secrets.APPLE_TEAM_ID }}" >> "$GITHUB_ENV"
          fi
      - run: npx electron-builder --mac --arm64 --x64 --publish never ${MAC_EB_ARGS:-}
      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: |
            dist/*.dmg
            dist/*.zip
            dist/*.blockmap
            dist/latest-mac.yml
